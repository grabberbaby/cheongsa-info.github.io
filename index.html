<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>청사 시설관리 연락처</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #f4f6f8;
      line-height: 1.6;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 1.7rem;
    }

    .intro {
      margin-top: 0;
      color: #4b5563;
    }

    .notice {
      padding: 12px 14px;
      border-left: 4px solid #2563eb;
      background: #ffffff;
      margin: 20px 0;
    }

    .contact {
      margin: 12px 0;
      padding: 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
    }

    .contact h2 {
      margin: 0 0 4px;
      font-size: 1.15rem;
    }

    .contact p {
      margin: 4px 0 12px;
      color: #4b5563;
    }

    .call {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 6px;
      background: #1d4ed8;
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
    }

    .call:focus {
      outline: 3px solid #111827;
      outline-offset: 3px;
    }

    footer {
      margin-top: 24px;
      color: #4b5563;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>청사 시설관리 연락처</h1>
    <p class="intro">화장실 이용 중 불편 사항이 있으면 담당 업무를 선택해 연락해 주세요.</p>

    <section class="contact">
      <h2>청소</h2>
      <p>청소 상태, 비품 부족 등</p>
      <a class="call" href="tel:0647106936">전화 064-710-6936</a>
    </section>

    <section class="contact">
      <h2>전기</h2>
      <p>조명, 콘센트 고장 등</p>
      <a class="call" href="tel:0647106936">전화 064-710-6936</a>
    </section>

    <section class="contact">
      <h2>설비</h2>
      <p>수도, 대(소)변기, 환풍기 등</p>
      <a class="call" href="tel:0647106937">전화 064-710-6937</a>
    </section>

    <section class="contact">
      <h2>건축</h2>
      <p>문, 벽, 바닥 등 시설 파손</p>
      <a class="call" href="tel:0647106935">전화 064-710-6935</a>
    </section>

    <section class="contact">
      <h2>방역</h2>
      <p>해충, 방역 관련 문의</p>
      <a class="call" href="tel:0647106936">전화 064-710-6936</a>
    </section>

    <footer>
      운영 시간: 평일 09:00~18:00<br>
    </footer>
  </main>
</body>
</html>
